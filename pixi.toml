[workspace]
authors = ["meganfrisella <meganfrisella@gmail.com>"]
channels = ["conda-forge"]
name = "soil-moisture-au26"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
smoke = "python tests/test_smoke.py"
test = "python -m unittest discover -s tests"

[dependencies]
python = ">=3.14.7,<3.15"
matplotlib = ">=3.11.2,<4"
numpy = ">=2.5.3,<3"
pandas = ">=3.0.6,<4"
ipykernel = ">=7.4.0,<8"
geopandas = ">=1.2.0,<2"
pooch = ">=1.9.0,<2"
obspy = ">=1.5.1,<2"
jupyterlab = ">=4.6.4,<5"
xarray = ">=2026.9.0,<2027"
requests = ">=2.34.2,<3"
boto3 = ">=1.43.120,<2"
urllib3 = ">=2.8.0,<3"
scipy = ">=1.18.1,<2"
seaborn = ">=0.13.2,<0.14"
cartopy = ">=0.26.0,<0.27"
h5py = ">=3.16.0,<4"
pyarrow = ">=26.0.0,<27"
earthengine-api = ">=1.7.51,<2"
pyhdf = ">=0.11.7,<0.12"

[pypi-dependencies]
drydowns = { path = "external/drydowns", editable = true }
ecflux = { path = "external/ecflux", editable = true }

# Same ecflux v0.0.1 source requested upstream; editable to retain CSV assets.
[pypi-options.dependency-overrides]
ecflux = { path = "external/ecflux", editable = true }
