# International Soil Moisture Network (ISMN) in situ observations
#
# Provider facts and provenance for `ismn` (no scientific choices: those are in
# config/pipeline.yml). `request:` holds the provider wording and fixed facts that
# are copied verbatim into locks/ismn.json by scripts/plan.py; the stations,
# dates, bands and storage are added from the selection and pipeline.yml.
# Full rights evidence: records/source_provenance.json (sources.ismn).
provenance:
  provider: ISMN / ICWRGC / BfG and the 14 contributing networks
  product: CONUS soil moisture, soil temperature and separately retained provider precipitation
  version: 2026-11-04 provider export; no provider semantic version is declared
  citation:
    doi: 10.5194/hess-25-5749-2021
    authors: Dorigo et al.
    year: 2021
  network_citations: config/ismn_network_provenance.json
  rights:
    declaration: ISMN Terms and Conditions
    scope: Registered user and associated organisation; scientific use only; original-data onward transfer
      prohibited; acknowledge ISMN and all contributing networks; original-owner rights retained.
request:
  depth_units: m
  schema_version: 1
